version: 2

# Weekly version updates, minor and patch grouped into one PR per ecosystem. The chore/ci prefixes keep
# release-please from cutting a release for a dependency bump.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)

  # Central package management: versions live in Directory.Packages.props at the root.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: uv
    directory: /src/ai
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
