# Alembic for schema `ai`. The database URL comes from NORMETRY_DATABASE_URL (see migrations/env.py),
# never from this file.

[alembic]
script_location = %(here)s/migrations
path_separator = os

# New revisions come out sorted and formatted for Ruff. Only the isort rules are fixed, so the
# skeleton keeps its `op` and `sa` imports.
[post_write_hooks]
hooks = ruff_imports, ruff_format
ruff_imports.type = module
ruff_imports.module = ruff
ruff_imports.options = check --fix --select I REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# WARNING keeps SQL statements and their parameters out of the logs.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
